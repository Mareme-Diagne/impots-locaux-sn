<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond clair fixe : garantit la lisibilité que GitHub soit en thème clair ou sombre -->
  <rect x="0" y="0" width="640" height="160" rx="18" fill="#f7f8fb"/>

  <!-- Icône : carré marine centré sur x=70, tous les éléments alignés sur ce même axe -->
  <rect x="10" y="20" width="120" height="120" rx="24" fill="#131c33"/>

  <!-- Toit du fronton : base large de 68px, centrée en x=70 -->
  <polygon points="70,34 106,64 34,64" fill="#b8862e"/>

  <!-- 4 colonnes égales, espacement régulier, groupe centré en x=70 -->
  <rect x="40" y="70" width="9" height="46" fill="#b8862e"/>
  <rect x="57" y="70" width="9" height="46" fill="#b8862e"/>
  <rect x="74" y="70" width="9" height="46" fill="#b8862e"/>
  <rect x="91" y="70" width="9" height="46" fill="#b8862e"/>

  <!-- Socle : même largeur/centrage que le toit -->
  <rect x="34" y="118" width="72" height="11" fill="#b8862e"/>

  <text x="150" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="600" fill="#131c33">ImpôtsLocaux-SN</text>
  <text x="152" y="113" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#667085">Gestion des taxes locales et parafiscales sénégalaises</text>
</svg>